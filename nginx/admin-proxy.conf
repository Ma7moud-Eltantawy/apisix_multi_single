# ============================================================
#  Nginx — Unified Control Plane & Admin Proxy (Port 9012)
#
#  Routing Architecture on Port 9012:
#    /apisix/admin/user/* → 🔐 Dashboard Manager Auth (Port 9000)
#    /apisix/admin/*      → ⚙️ Direct APISIX Admin REST API (Port 9180 - X-API-KEY)
#    /adminpanel/*        → 🔑 APISIX Built-in React UI (Port 9180/ui/)
#    /ui/*                → 🔑 APISIX Built-in React UI (Port 9180/ui/)
#    /*                   → 📊 APISIX Classic Dashboard UI (Port 9000)
# ============================================================

upstream dashboard_backend {
    server apisix-dashboard:9000;
    keepalive 32;
}

upstream admin_api_backend {
    server apisix:9180;
    keepalive 32;
}

server {
    listen 9180;
    server_name _;

    # ── 1. Classic Dashboard User Auth & Session APIs ─────────────────────
    location /apisix/admin/user/ {
        proxy_pass         http://dashboard_backend/apisix/admin/user/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # ── 2. Direct APISIX Admin REST API (Supports X-API-KEY) ───────────────
    location /apisix/admin/ {
        proxy_pass         http://admin_api_backend/apisix/admin/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # ── 3. APISIX Built-in React UI (/adminpanel & /ui) ───────────────────
    location /adminpanel/ {
        proxy_pass         http://admin_api_backend/ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
    }

    location = /ui {
        return 301 /ui/;
    }

    location /ui/ {
        proxy_pass         http://admin_api_backend/ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
    }

    # ── 4. APISIX Classic Dashboard UI & Static Assets ────────────────────
    location / {
        proxy_pass         http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
