# ============================================================
#  Nginx — Unified Control Plane & Admin Proxy
# ============================================================

upstream dashboard_backend {
    server apisix-dashboard:9000;
    keepalive 32;
}

upstream admin_api_backend {
    server apisix:9180;
    keepalive 32;
}

server {
    listen 9180;
    server_name _;

    # ── 1. Direct APISIX Admin REST API (for ADC CLI & Automation) ──────
    location /apisix/admin/ {
        proxy_pass         http://admin_api_backend/apisix/admin/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # ── 2. Official Apache APISIX React Dashboard ───────────────────────
    location / {
        proxy_pass         http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
