# ============================================================
#  Nginx — Unified Control Plane & Admin Proxy (Port 9013)
#
#  Unified Routing Architecture:
#    /                → 📊 APISIX Classic Dashboard (Username / Password)
#    /ui/             → 🔑 APISIX API-Key Dashboard Console (/ui/)
#    /apisix/admin/*  → ⚙️ APISIX Direct REST Admin API (X-API-KEY)
# ============================================================

upstream dashboard_backend {
    server apisix-dashboard:9000;
    keepalive 32;
}

upstream admin_api_backend {
    server apisix:9180;
    keepalive 32;
}

server {
    listen 9180;
    server_name _;

    # ── 1. APISIX API-Key Web Console (/ui/ and /adminpanel/) ─────────────
    location = /ui {
        return 301 /ui/;
    }

    location /ui/ {
        alias /usr/share/nginx/html/ui/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
    }

    location /adminpanel/ {
        alias /usr/share/nginx/html/ui/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
    }

    # ── 2. Direct APISIX Admin REST API (Supports X-API-KEY) ───────────────
    location /apisix/admin/ {
        proxy_pass         http://admin_api_backend/apisix/admin/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # ── 3. APISIX Classic Dashboard UI (Username / Password) ───────────────
    location / {
        proxy_pass         http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
