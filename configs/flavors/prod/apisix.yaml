name: qyadati-apisix-prod
version: 1.0.0
routes:
- name: prod-health-check
  uri: /health
  methods:
  - GET
  plugins:
    response-rewrite:
      body: '{"status":"healthy","service":"qyadati-gateway","env":"production"}'
      headers:
        set:
          Content-Type: application/json
          Cache-Control: no-store, no-cache, must-revalidate
- name: prod-api-docs
  uri: /docs*
  methods:
  - GET
  upstream:
    name: prod-docs-upstream
    type: roundrobin
    nodes:
    - host: docs-internal.qyadati.internal
      port: 3000
      weight: 1
- name: prod-auth-service
  uri: /api/v1/auth/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: https://qyadati.com,https://app.qyadati.com,https://dashboard.qyadati.com
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type,X-Requested-With,X-Qyadati-Client
      allow_credentials: true
      max_age: 3600
    limit-count:
      count: 100
      time_window: 60
      rejected_code: 429
      rejected_msg: '{"error":"Too many requests. Please slow down."}'
      key_type: var
      key: remote_addr
  upstream:
    name: prod-auth-upstream
    type: roundrobin
    nodes:
    - host: auth-service.qyadati.internal
      port: 4000
      weight: 1
- name: prod-users-service
  uri: /api/v1/users/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: https://qyadati.com,https://app.qyadati.com
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type
      allow_credentials: true
    limit-count:
      count: 300
      time_window: 60
      rejected_code: 429
      key_type: var
      key: remote_addr
  upstream:
    name: prod-users-upstream
    type: roundrobin
    nodes:
    - host: users-service.qyadati.internal
      port: 4001
      weight: 1
- name: prod-payments-service
  uri: /api/v1/payments/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: https://qyadati.com,https://app.qyadati.com
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type,X-Idempotency-Key
      allow_credentials: true
    limit-count:
      count: 50
      time_window: 60
      rejected_code: 429
      key_type: var
      key: remote_addr
  upstream:
    name: prod-payments-upstream
    type: roundrobin
    nodes:
    - host: payments-service.qyadati.internal
      port: 4002
      weight: 1
- name: prod-courses-service
  uri: /api/v1/courses/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: https://qyadati.com,https://app.qyadati.com
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type
      allow_credentials: true
    limit-count:
      count: 500
      time_window: 60
      rejected_code: 429
      key_type: var
      key: remote_addr
  upstream:
    name: prod-courses-upstream
    type: roundrobin
    nodes:
    - host: courses-service.qyadati.internal
      port: 4003
      weight: 1
services: []
upstreams:
- id: لابيلابلاب
  name: لابيلابلابلالا
  type: roundrobin
  nodes:
    host.docker.internal:3001: 1
global_rules: []
