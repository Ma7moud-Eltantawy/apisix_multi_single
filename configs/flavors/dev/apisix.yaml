name: qyadati-apisix-dev
version: 1.0.0
routes:
- name: dev-health-check
  uri: /health
  methods:
  - GET
  plugins:
    response-rewrite:
      body: '{"status":"healthy","service":"qyadati-gateway","env":"dev","flavor":"development"}'
      headers:
        set:
          Content-Type: application/json
- name: dev-api-docs
  uri: /docs*
  methods:
  - GET
  upstream:
    name: dev-docs-upstream
    type: roundrobin
    nodes:
    - host: dev-docs.qyadati.internal
      port: 3000
      weight: 1
- name: dev-auth-service
  uri: /api/v1/auth/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: '*'
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: '*'
      allow_credentials: true
  upstream:
    name: dev-auth-upstream
    type: roundrobin
    nodes:
    - host: dev-auth.qyadati.internal
      port: 4000
      weight: 1
- name: dev-users-service
  uri: /api/v1/users/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: '*'
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: '*'
      allow_credentials: true
  upstream:
    name: dev-users-upstream
    type: roundrobin
    nodes:
    - host: dev-users.qyadati.internal
      port: 4001
      weight: 1
- name: dev-payments-service
  uri: /api/v1/payments/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: '*'
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: '*'
      allow_credentials: true
  upstream:
    name: dev-payments-upstream
    type: roundrobin
    nodes:
    - host: dev-payments.qyadati.internal
      port: 4002
      weight: 1
- name: dev-courses-service
  uri: /api/v1/courses/*
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  plugins:
    cors:
      allow_origins: '*'
      allow_methods: GET,POST,PUT,DELETE,OPTIONS
      allow_headers: '*'
      allow_credentials: true
  upstream:
    name: dev-courses-upstream
    type: roundrobin
    nodes:
    - host: dev-courses.qyadati.internal
      port: 4003
      weight: 1
services: []
upstreams:
- id: لابيلابلاب
  name: لابيلابلابلالا
  type: roundrobin
  nodes:
    host.docker.internal:3001: 1
global_rules: []
