# ==============================================================================
# 🎯 Qyadati APISIX Declarative Configuration (SINGLE-FLAVOR & ROOT DEFAULT)
# ==============================================================================
# Architecture Modes:
#   1. SINGLE-FLAVOR : This file (configs/apisix.yaml) manages all routes centrally.
#   2. MULTI-FLAVOR  : Managed in configs/flavors/{desktop,local,dev,staging,prod}/
# ==============================================================================
name: qyadati-apisix-single
version: 1.0.0

routes:
  # 1. Health Check Endpoint
  - name: health-check
    uri: /health
    methods:
      - GET
    plugins:
      response-rewrite:
        body: '{"status":"healthy","service":"qyadati-gateway","mode":"single-flavor"}'
        headers:
          set:
            Content-Type: application/json

  # 2. Swagger API Documentation
  - name: api-docs
    uri: /docs*
    methods:
      - GET
    upstream:
      name: swagger-upstream
      type: roundrobin
      nodes:
        - host: host.docker.internal
          port: 3000
          weight: 1

  # 3. Auth Microservice Route
  - name: auth-service
    uri: /api/v1/auth/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "*"
        allow_headers: "*"
    upstream:
      name: auth-upstream
      type: roundrobin
      nodes:
        - host: host.docker.internal
          port: 4000
          weight: 1

  # 4. Users Microservice Route
  - name: users-service
    uri: /api/v1/users/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "*"
        allow_headers: "*"
    upstream:
      name: users-upstream
      type: roundrobin
      nodes:
        - host: host.docker.internal
          port: 4001
          weight: 1

  # 5. Payments Microservice Route
  - name: payments-service
    uri: /api/v1/payments/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "*"
        allow_headers: "*"
    upstream:
      name: payments-upstream
      type: roundrobin
      nodes:
        - host: host.docker.internal
          port: 4002
          weight: 1

  # 6. Courses / LMS Microservice Route
  - name: courses-service
    uri: /api/v1/courses/*
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "*"
        allow_headers: "*"
    upstream:
      name: courses-upstream
      type: roundrobin
      nodes:
        - host: host.docker.internal
          port: 4003
          weight: 1

services: []
upstreams: []
global_rules: []
