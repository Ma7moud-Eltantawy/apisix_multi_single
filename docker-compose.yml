# ============================================================
#  Apache APISIX - Fully Environment-Driven Stack (Qyadati)
#  Ports, Container Names, Full Image URLs & Secrets driven by .env
# ============================================================

name: qyadati-apisix

networks:
  apisix-network:
    driver: bridge

volumes:
  etcd_data:

services:

  # -- 1. etcd (Config Store) --------------------------------
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.13}
    container_name: ${CONTAINER_PREFIX:-qyadati-apisix}-etcd
    restart: unless-stopped
    networks:
      - apisix-network
    environment:
      ETCD_ENABLE_V2: "true"
      ETCD_DATA_DIR: "/etcd-data"
      ETCD_NAME: "etcd0"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd:${ETCD_PEER_PORT:-2380}"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:${ETCD_PEER_PORT:-2380}"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:${ETCD_CLIENT_PORT:-2379}"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:${ETCD_CLIENT_PORT:-2379}"
      ETCD_INITIAL_CLUSTER: "etcd0=http://etcd:${ETCD_PEER_PORT:-2380}"
      ETCD_INITIAL_CLUSTER_STATE: "new"
      ETCD_INITIAL_CLUSTER_TOKEN: "${ETCD_CLUSTER_TOKEN:-qyadati-apisix-etcd-cluster}"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:${ETCD_CLIENT_PORT:-2379}", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # -- 2. APISIX (Gateway + Admin API + /ui/ Dashboard) -------
  apisix:
    image: ${APISIX_IMAGE:-apache/apisix:latest}
    container_name: ${CONTAINER_PREFIX:-qyadati-apisix}-gateway
    restart: unless-stopped
    networks:
      - apisix-network
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    ports:
      - "${APISIX_HTTP_PORT:-9280}:9080"   # HTTP Gateway (Data Plane)
      - "${APISIX_HTTPS_PORT:-9444}:9443"   # HTTPS Gateway
      - "${APISIX_ADMIN_PORT:-9181}:9180"   # Admin API + /ui/ Dashboard
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # -- 3. APISIX Classic Dashboard (Port 9012/9000) -----------
  apisix-dashboard:
    image: ${DASHBOARD_IMAGE:-apache/apisix-dashboard:latest}
    container_name: ${CONTAINER_PREFIX:-qyadati-apisix}-dashboard
    restart: unless-stopped
    networks:
      - apisix-network
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASS: ${DASHBOARD_PASS:-AdminQyadati2026}
    entrypoint:
      - sh
      - -c
      - |
        awk '{u=ENVIRON["DASHBOARD_USER"]?ENVIRON["DASHBOARD_USER"]:"admin"; p=ENVIRON["DASHBOARD_PASS"]?ENVIRON["DASHBOARD_PASS"]:"AdminQyadati2026"; gsub(/\$$DASHBOARD_USER/, u); gsub(/\$$DASHBOARD_PASS/, p); print}' /usr/local/apisix-dashboard/conf/conf.yaml.template > /usr/local/apisix-dashboard/conf/conf.yaml && exec ./manager-api
    ports:
      - "${CLASSIC_DASHBOARD_PORT:-9022}:9000"
    volumes:
      - ./dashboard/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml.template:ro

  # -- 4. APISIX Unified Admin Proxy (Port 9012 - Unified Host Entry) -------
  admin-proxy:
    image: ${ADMIN_PROXY_IMAGE:-nginx:alpine}
    container_name: ${CONTAINER_PREFIX:-qyadati-apisix}-admin-proxy
    restart: unless-stopped
    networks:
      - apisix-network
    depends_on:
      - apisix
      - apisix-dashboard
    volumes:
      - ./nginx/admin-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_PROXY_PORT:-9012}:9180"   # Unified Entry on 9012: / (Classic) & /ui/ (React UI) & /apisix/admin/
